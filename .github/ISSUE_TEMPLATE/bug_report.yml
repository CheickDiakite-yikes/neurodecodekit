name: Bug report
description: Report a reproducible NeuroDecodeKit software defect using synthetic or redacted inputs.
title: "[Bug] "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Do not attach neural recordings, participant data, target/event content, credentials, signed URLs, or private cloud links. Follow SECURITY.md for sensitive reports.
  - type: input
    id: commit
    attributes:
      label: NeuroDecodeKit version or commit
      placeholder: "0.1.0 or 2796dee"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and architecture.
      placeholder: "macOS 15, Python 3.12, arm64"
    validations:
      required: true
  - type: input
    id: extras
    attributes:
      label: Installed optional extras and relevant package versions
      placeholder: "neuro,dev; MNE 1.12.1; NumPy 2.5.0; SciPy 1.18.0"
  - type: textarea
    id: command
    attributes:
      label: Minimal command or API call
      description: Use a synthetic fixture or redact local paths and identifiers.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the exception type and concise message. Remove sensitive values.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Explain how to reproduce without real neural data.
  - type: textarea
    id: boundaries
    attributes:
      label: Access and resource boundary
      description: Note data reads, network calls, generated bytes, runtime, RSS, and threads if relevant.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed raw/derived neural data, participant information, event/target content, secrets, signed URLs, and absolute private paths.
          required: true
        - label: This issue can be discussed publicly; otherwise I will use the private security route.
          required: true
